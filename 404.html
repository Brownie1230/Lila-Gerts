<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Страница не найдена · Lila Gerts</title>
<meta name="robots" content="noindex">
<meta name="theme-color" content="#310907">
<!-- GitHub Pages serves this file for any missing path, at any depth, so every
     link here is resolved against <base>. On the project site that is
     /Lila-Gerts/; on a custom domain it is /. The script picks one. -->
<base href="/Lila-Gerts/">
<script>
  if (location.pathname.indexOf("/Lila-Gerts/") !== 0) document.querySelector("base").setAttribute("href", "/");
</script>
<link rel="icon" href="assets/favicon-32.png" sizes="32x32">
<link rel="stylesheet" href="assets/css/fonts.css">
<style>
  :root{--a:#FBD2D4;--b:#FCEEEC;--cherry:#310907;--ink:#F7E9DC;--soft:#DCBCA8;--rose:#E3A0A8}
  *{box-sizing:border-box}
  html,body{height:100%}
  body{margin:0;display:grid;place-items:center;padding:clamp(14px,3.2vw,56px);
    background:var(--b);background-image:repeating-linear-gradient(90deg,var(--a) 0 38px,var(--b) 38px 76px);
    font-family:"Onest",ui-sans-serif,system-ui,sans-serif;color:var(--ink)}
  main{width:min(640px,100%);background:var(--cherry);border-radius:clamp(16px,2vw,28px);
    padding:clamp(32px,6vw,64px) clamp(24px,5vw,56px);text-align:center;
    box-shadow:0 30px 90px -40px rgb(0 0 0 / .55)}
  img{width:min(260px,70%);height:auto;filter:drop-shadow(0 18px 30px rgb(0 0 0 / .45))}
  h1{font-family:"Cormorant Garamond",Georgia,serif;font-weight:500;font-size:clamp(2rem,1.4rem + 2.4vw,3rem);
    line-height:1.1;margin:28px 0 12px}
  p{margin:0 auto;max-width:34ch;color:var(--soft);font-size:1.1rem;line-height:1.55}
  a{display:inline-block;margin-top:28px;padding:.9em 1.6em;border-radius:99px;background:var(--rose);
    color:var(--cherry);font-weight:600;text-decoration:none}
  a:hover{background:#F2D2D6}
  a:focus-visible{outline:2px solid var(--rose);outline-offset:3px}
</style>
</head>
<body>
<main>
  <img src="assets/img/logo.webp" width="900" height="602" alt="Lila Gerts">
  <h1>Такой страницы нет</h1>
  <p>Возможно, ссылка устарела. Все свечи, наборы и подсвечники на главной.</p>
  <a href="./">На главную</a>
</main>
</body>
</html>
